<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Suelo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0f14;
      --surface: #111820;
      --border:  #1e2d3d;
      --text:    #cdd9e5;
      --muted:   #4a5568;
      --accent:  #00d4aa;
      --mono:    'Space Mono', monospace;
      --sans:    'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }
    header {
      width: 100%; max-width: 480px;
      margin-bottom: 28px;
    }
    .label-top {
      font-family: var(--mono);
      font-size: 0.63rem; letter-spacing: 3px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-family: var(--mono);
      font-size: 1.4rem; font-weight: 700;
      color: var(--accent); letter-spacing: 1px;
    }
    .status-bar {
      width: 100%; max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
      font-size: 0.78rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
      transition: background 0.4s;
    }
    .dot.online  { background: #00d4aa; box-shadow: 0 0 8px #00d4aa88; animation: pulse 2s infinite; }
    .dot.offline { background: #e74c3c; }
    .dot.loading { background: #f39c12; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    #status-text { flex: 1; color: var(--text); }
    #last-update { font-family: var(--mono); font-size: 0.63rem; color: var(--muted); }

    .stale-warning {
      width: 100%; max-width: 480px;
      background: color-mix(in srgb, #f39c12 10%, transparent);
      border: 1px solid color-mix(in srgb, #f39c12 30%, transparent);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.76rem; color: #f39c12;
      margin-bottom: 14px;
      display: none; gap: 8px; align-items: center;
    }
    .stale-warning.visible { display: flex; }

    .cards {
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 22px 18px;
      position: relative; overflow: hidden;
      transition: border-color 0.4s;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--card-color, var(--accent));
      border-radius: 16px 16px 0 0;
      transition: background 0.4s;
    }
    .card-label {
      font-family: var(--mono);
      font-size: 0.62rem; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-value {
      font-family: var(--mono);
      font-size: 3.4rem; font-weight: 700; line-height: 1;
      color: var(--card-color, var(--accent));
      transition: color 0.4s;
    }
    .card-unit { font-size: 1.2rem; font-weight: 400; color: var(--muted); }
    .card-badge {
      display: inline-block;
      margin-top: 12px; padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
      background: color-mix(in srgb, var(--card-color, var(--accent)) 15%, transparent);
      color: var(--card-color, var(--accent));
      border: 1px solid color-mix(in srgb, var(--card-color, var(--accent)) 30%, transparent);
      transition: all 0.4s;
    }
    .card-adc {
      font-family: var(--mono);
      font-size: 0.65rem; color: var(--muted); margin-top: 6px;
    }
    .card-time {
      font-family: var(--mono);
      font-size: 0.62rem; color: var(--muted); margin-top: 10px;
    }

    .btn-refresh {
      width: 100%; max-width: 480px;
      margin-top: 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 13px;
      color: var(--text);
      font-family: var(--mono); font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
    .countdown {
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--muted); margin-top: 8px; text-align: center;
    }
    footer {
      margin-top: 40px;
      font-family: var(--mono); font-size: 0.6rem;
      color: #1e2d3d; letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <div class="label-top">ESP32-S3 · DS18B20 + SEN0193</div>
    <h1>🌿 Monitor de Suelo</h1>
  </header>

  <div class="status-bar">
    <div class="dot loading" id="dot"></div>
    <span id="status-text">Cargando datos...</span>
    <span id="last-update">—</span>
  </div>

  <div class="stale-warning" id="stale-warning">
    ⚠️ Arduino sin enviar datos — mostrando última lectura guardada
  </div>

  <div class="cards">
    <div class="card" id="card-temp" style="--card-color:#27ae60">
      <div class="card-label">🌡️ Temperatura del suelo</div>
      <div class="card-value" id="val-temp">—<span class="card-unit"> °C</span></div>
    </div>
    <div class="card" id="card-hum" style="--card-color:#27ae60">
      <div class="card-label">💧 Humedad volumétrica (VWC)</div>
      <div class="card-value" id="val-vwc">—<span class="card-unit"> %</span></div>
      <div class="card-badge" id="badge-estado">—</div>
      <div class="card-adc" id="val-adc"></div>
      <div class="card-time" id="val-time"></div>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchDatos()">↻ Actualizar ahora</button>
  <p class="countdown">Próxima actualización en <span id="ct">30</span>s</p>

  <footer>MONITOR DE SUELO · SERVIDOR EN LA NUBE</footer>

<script>
  function colorVWC(v) {
    if (v < 10) return '#e74c3c';
    if (v < 20) return '#e67e22';
    if (v < 35) return '#27ae60';
    if (v < 50) return '#2980b9';
    return '#8e44ad';
  }
  function colorTemp(t) {
    if (t < 10) return '#2980b9';
    if (t < 25) return '#27ae60';
    if (t < 35) return '#e67e22';
    return '#e74c3c';
  }
  function estadoVWC(v) {
    if (v < 10)  return 'Suelo seco';
    if (v < 20)  return 'Humedad baja';
    if (v < 35)  return 'Humedad óptima';
    if (v < 50)  return 'Humedad alta';
    return 'Suelo saturado';
  }

  // Cuántos minutos han pasado desde el último dato del Arduino
  function tiempoDesde(isoString) {
    const mins = Math.floor((Date.now() - new Date(isoString)) / 60000);
    if (mins < 1)  return 'hace menos de 1 min';
    if (mins < 60) return `hace ${mins} min`;
    const hrs = Math.floor(mins / 60);
    return `hace ${hrs} h`;
  }

  async function fetchDatos() {
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const stale = document.getElementById('stale-warning');
    dot.className = 'dot loading';
    statusText.textContent = 'Actualizando...';

    try {
      const res = await fetch('/api/datos');
      if (!res.ok) throw new Error('sin datos');
      const d = await res.json();

      const cT = colorTemp(d.temperatura);
      const cH = colorVWC(d.vwc);

      document.getElementById('val-temp').innerHTML =
        `${d.temperatura.toFixed(1)}<span class="card-unit"> °C</span>`;
      document.getElementById('val-vwc').innerHTML =
        `${d.vwc.toFixed(1)}<span class="card-unit"> %</span>`;
      document.getElementById('badge-estado').textContent =
        d.estado || estadoVWC(d.vwc);
      document.getElementById('val-adc').textContent =
        d.adc ? `ADC raw: ${d.adc}` : '';
      document.getElementById('val-time').textContent =
        d.timestamp ? `Última lectura del Arduino: ${tiempoDesde(d.timestamp)}` : '';

      document.getElementById('card-temp').style.setProperty('--card-color', cT);
      document.getElementById('card-hum').style.setProperty('--card-color', cH);
      document.getElementById('badge-estado').style.cssText =
        `background:color-mix(in srgb,${cH} 15%,transparent);color:${cH};border-color:color-mix(in srgb,${cH} 30%,transparent)`;

      // Advertir si el último dato tiene más de 2 minutos
      const mins = Math.floor((Date.now() - new Date(d.timestamp)) / 60000);
      if (mins >= 2) {
        stale.classList.add('visible');
        dot.className = 'dot offline';
        statusText.textContent = 'Arduino sin enviar datos';
      } else {
        stale.classList.remove('visible');
        dot.className = 'dot online';
        statusText.textContent = 'Servidor activo · Arduino enviando datos';
      }

      document.getElementById('last-update').textContent =
        new Date().toLocaleTimeString('es-CL');

    } catch(e) {
      dot.className = 'dot offline';
      statusText.textContent = 'Error al conectar con el servidor';
    }
  }

  let s = 30;
  setInterval(() => {
    s--;
    const el = document.getElementById('ct');
    if (el) el.textContent = s + 's';
    if (s <= 0) { s = 30; fetchDatos(); }
  }, 1000);

  fetchDatos();
</script>
</body>
</html>
